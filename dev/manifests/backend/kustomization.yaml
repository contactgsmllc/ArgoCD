apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: society
resources:
  - deployment.yaml
  - service.yaml
# The CI pipeline updates newTag on every push to the "dev" branch:
#   kustomize edit set image dearsrini/society-backend=dearsrini/society-backend:<commit-sha>
images:
  - name: dearsrini/society-backend
    newTag: dev
