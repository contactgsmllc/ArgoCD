# NOTE: no persistent volume - data lives in the container and is lost on restart
# (same as before Argo CD). See docs for the recommended NAS-backed storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: society-zookeeper
  labels:
    app: society-zookeeper
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: society-zookeeper
  template:
    metadata:
      labels:
        app: society-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: society-backend-config
          ports:
            - containerPort: 2181
              protocol: TCP
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 250m, memory: 512Mi }
