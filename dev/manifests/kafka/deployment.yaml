# NOTE: no persistent volume - data lives in the container and is lost on restart
# (same as before Argo CD). See docs for the recommended NAS-backed storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: society-kafka
  labels:
    app: society-kafka
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: society-kafka
  template:
    metadata:
      labels:
        app: society-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: society-backend-config
          ports:
            - containerPort: 9092
              protocol: TCP
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
