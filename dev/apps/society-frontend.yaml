apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: society-frontend
  namespace: argocd
spec:
  project: society
  source:
    repoURL: git@github.com:contactgsmllc/ArgoCD.git
    targetRevision: main
    path: dev/manifests/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: society
  # Auto-sync: Git changes are applied automatically.
  #   prune    - resources removed from Git are removed from the cluster
  #   selfHeal - manual kubectl changes are reverted to the Git state
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
