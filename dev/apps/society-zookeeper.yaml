apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: society-zookeeper
  namespace: argocd
spec:
  project: society
  source:
    repoURL: git@github.com:contactgsmllc/ArgoCD.git
    targetRevision: main
    path: dev/manifests/zookeeper
  destination:
    server: https://kubernetes.default.svc
    namespace: society
  # Manual sync while adopting existing resources.
  # Stateful/infra component: keep manual sync permanently.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
