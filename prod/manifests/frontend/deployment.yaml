apiVersion: apps/v1
kind: Deployment
metadata:
  name: society-frontend
  namespace: society
  labels:
    app: society-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: society-frontend
  template:
    metadata:
      labels:
        app: society-frontend
    spec:
      containers:
      - name: society-frontend
        image: dearsrini/society-frontend:test
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

