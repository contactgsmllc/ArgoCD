apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: society-kafka-prod
  namespace: argocd
spec:
  project: societyargocd
  source:
    repoURL: git@github.com:contactgsmllc/ArgoCD.git
    targetRevision: main
    path: prod/manifests/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: societyargocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true